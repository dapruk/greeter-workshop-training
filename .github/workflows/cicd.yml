name: CI/CD
run-name: Build Images
on: [push]
jobs:
  Build-Images:
    runs-on: ubuntu-latest
    steps:
      - name: checking out code
        uses: actions/checkout@v5
      - name: build image
        run: docker build --build-arg VITE_SUPABASE_URL=${{secrets.VITE_SUPABASE_URL}} --build-arg VITE_SUPABASE_ANON_KEY=${{secrets.VITE_SUPABASE_ANON_KEY}} -t git.workshop.bteklabs.com/dapruk/greeter-app-cik:latest .
      - name: login to docker
        run: echo ${{secrets.BTEK_GIT_DEPLOYMENT_TOKEN}} | docker login --username dapruk --password-stdin git.workshop.bteklabs.com
      - name: push image to registry
        run: docker push git.workshop.bteklabs.com/dapruk/greeter-app-cik:latest
      - name: pull and rerun image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          password: ${{secrets.SSH_PASSWORD}}
          port: ${{secrets.SSH_PORT}}
          script: |
            cd server-greeter-app-cik 
            docker-compose pull
            docker-compose up -d
